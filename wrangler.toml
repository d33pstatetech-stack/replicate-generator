name = "replicate-prompt-orchestrator"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
# Built React client (client/dist), served from the edge cache.
# Rebuild with `npm --prefix client run build` before deploying.
directory = "client/dist"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "replicate-orchestrator"
# Environment-specific. Replace with the id from `wrangler d1 create` on a fork.
database_id = "be087ef6-6d86-46a3-a305-48c71a32ac85"

[[d1_databases]]
binding = "HISTORY"
database_name = "genai-history"
# Environment-specific. Replace with the id from `wrangler d1 create` on a fork.
database_id = "6a271502-ea90-411b-935c-50a16d5d5300"
migrations_dir = "migrations-history"

[[r2_buckets]]
binding = "OUTPUTS_BUCKET"
bucket_name = "genai-assets"

[vars]
# Rollback switch for Prompt Atlas guide injection. Set to "0" to disable
# without a code change — see docs/prompt-atlas-rollback.md.
GUIDE_INJECTION = "1"
# Secrets, set via .dev.vars locally or `wrangler secret put` per environment.
# The enhancer resolves each provider's key from the `apiKeyEnv` named on its
# entry in src/worker.js DEFAULT_LLM_PROVIDERS — the field is what replaced the
# old baseUrl.includes('venice.ai') sniff, which sent the OpenRouter key to every
# host that was not literally venice.ai. Adding a provider means adding its
# secret here too:
#   REPLICATE_API_TOKEN   - predictions, stays server-side
#   EXPLABS_API_KEY       - https://api.experientiallabs.ai/v1 (chain default, first)
#   OPENROUTER_API_KEY    - https://openrouter.ai/api/v1
#   VENICE_API_KEY        - https://api.venice.ai/api/v1
#   HUGGINGFACE_API_KEY   - /api/hf/file private-repo reads
# An empty apiKeyEnv falls back to the legacy venice sniff, so llm_config rows
# written before the field existed keep working.
# Repos the /api/hf/file proxy may serve, as comma-separated owner/repo or
# owner/* entries. EMPTY BY DEFAULT, and that is the correct setting unless you
# have a PRIVATE LoRA that Replicate cannot fetch on its own.
#
# With this empty no rewriting happens at all: a HuggingFace URL entered in a
# LoRA field is passed to Replicate exactly as typed, and Replicate fetches it
# from the Hub. That is the right path for every PUBLIC adapter - including
# public repos you own - and it needs nothing from this Worker.
#
# Only set this when a repo is genuinely private or gated. Two prerequisites,
# both easy to miss:
#   1. An Access BYPASS must cover /api/hf/file. If an Access application
#      covers the whole hostname without a bypass, Replicate receives a login
#      page instead of the weights and the prediction hangs at "starting".
#   2. The URL must contain /resolve/main/<file>. The bare owner/repo form
#      carries no filename, so it is deliberately NOT rewritten.
# Mirrors the muapi setting. Replicate's servers cannot fetch a private or gated
# HuggingFace repo either, so the same proxy applies. Verified 2026-10-03: every
# repo currently in the library, including Sentinel7/qwen-image, is readable
# anonymously, so these entries are insurance rather than a requirement - but they
# also keep the path working if a repo is ever made private.
HF_PROXY_REPO_ALLOWLIST = "D33pStateTech/*,Sentinel7/*"
# Canonical origin to advertise when rewriting HuggingFace URLs to the proxy.
# Leave empty to use the incoming request origin.
HF_PROXY_BASE_URL = ""
